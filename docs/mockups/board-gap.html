<title>Board Gap Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
/* Layout: the Orders card exactly as the Board tab renders it; only the board's side gap changes per variant. */
:root {
  --page: #F2F2F0; --card: #FFFFFF; --frame: #F1F1F1; --panel: #FFFFFF; --tray: rgba(0,0,0,0.045);
  --fg: #16181D; --muted: #6B6E76; --faint: #A3A6AD; --border: rgba(0,0,0,0.10); --dash: rgba(0,0,0,0.14);
  --primary: #1A1D24; --primary-fg: #FAFAFA; --ruler: #E5484D;
  --font: "Geist", ui-sans-serif, system-ui, sans-serif; --bn: "Hind Siliguri", "Geist", sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0F1012; --card: #17181B; --frame: #1F2024; --panel: #17181B; --tray: rgba(255,255,255,0.06);
  --fg: #EDEDEF; --muted: #A0A3AA; --faint: #6C6F76; --border: rgba(255,255,255,0.10); --dash: rgba(255,255,255,0.16);
  --primary: #EDEDEF; --primary-fg: #111214; --ruler: #FF6369; color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #0F1012; --card: #17181B; --frame: #1F2024; --panel: #17181B; --tray: rgba(255,255,255,0.06);
  --fg: #EDEDEF; --muted: #A0A3AA; --faint: #6C6F76; --border: rgba(255,255,255,0.10); --dash: rgba(255,255,255,0.16);
  --primary: #EDEDEF; --primary-fg: #111214; --ruler: #FF6369; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--fg); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; padding-bottom: 100px; }
.wrap { max-width: 1400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; display: grid; gap: 16px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 20px; font-weight: 400; }
.top p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.theme { border: 0; border-radius: 999px; height: 30px; padding: 0 12px; background: var(--card); color: var(--fg); box-shadow: 0 0 0 1px var(--border); cursor: pointer; font: inherit; font-size: 12px; transition: transform 160ms cubic-bezier(0.23,1,0.32,1); }
.theme:active { transform: scale(0.97); }
.note { font-size: 13px; color: var(--muted); }
.note b { color: var(--fg); font-weight: 500; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.head { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-bottom: 1px solid var(--border); }
.head b { font-size: 15px; font-weight: 600; }
.head i { width: 1px; height: 14px; background: var(--border); }
.head span { color: var(--muted); font-size: 13px; }
.tabs { padding: 10px 8px; border-bottom: 1px solid var(--border); background: var(--page); overflow-x: auto; }
.tray { display: flex; gap: 0; background: var(--tray); border-radius: 12px; padding: 4px; min-width: max-content; }
.tabs .t { flex: 1 0 96px; text-align: center; padding: 12px 14px 11px; border-radius: 9px; color: var(--muted); }
.tabs .t b { display: block; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; color: var(--fg); opacity: .55; font-variant-numeric: tabular-nums; }
.tabs .t span { display: inline-flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 11px; font-weight: 500; white-space: nowrap; }
.tabs .t span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--d, #888); }
.tabs .t.on { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.05); color: var(--fg); }
.tabs .t.on b { opacity: 1; }

.stage { position: relative; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px var(--gap) 12px; }
.toolbar .meta { display: flex; align-items: baseline; gap: 10px; }
.toolbar .meta b { font-weight: 500; }
.toolbar .meta span { font-size: 12px; color: var(--muted); }
.tools { display: flex; gap: 8px; flex: 0 1 540px; min-width: 0; }
.search { flex: 1; min-width: 0; height: 36px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; }
.add { height: 36px; border: 0; border-radius: 8px; background: var(--primary); color: var(--primary-fg); font: inherit; font-size: 13px; font-weight: 500; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

.board { display: flex; gap: var(--colgap); overflow-x: auto; padding: 4px 0 24px var(--gap); align-items: flex-start; scrollbar-width: thin; }
.board::after { content: ""; flex: 0 0 max(0px, calc(var(--gap) - var(--colgap))); align-self: stretch; }
.col { flex: 0 0 var(--colw); background: var(--frame); border: 1px solid var(--border); border-radius: 12px; padding: 3px; display: grid; gap: 3px; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 6px 12px; }
.col-h .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.col-h b { flex: 1; min-width: 0; font-family: var(--bn); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { min-width: 18px; height: 18px; padding: 0 4px; border: 1px solid var(--border); border-radius: 5px; font-size: 10px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.x { color: var(--faint); font-size: 14px; line-height: 1; }
.cards { display: grid; gap: 8px; padding: 2px; }
.c { background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 12px; display: grid; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.c .r { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.c .r .when { font-family: var(--font); font-weight: 500; color: #B45309; }
.c .n { font-family: var(--bn); font-weight: 500; font-size: 14px; }
.c p { margin: 0; font-family: var(--bn); font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c .f { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--muted); }
.heavy { font-size: 10px; border: 1px solid rgba(124,58,237,.35); color: #7C3AED; border-radius: 5px; padding: 1px 5px; }
.empty { border: 1px dashed var(--dash); border-radius: 9px; padding: 20px 12px; text-align: center; font-family: var(--bn); font-size: 12px; color: var(--muted); }
.addrow { display: flex; align-items: center; gap: 6px; padding: 8px 10px; font-size: 12px; font-weight: 500; color: var(--muted); }
.newlist { flex: 0 0 var(--neww); height: 44px; border: 1px dashed var(--dash); border-radius: 12px; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--muted); font-size: 13px; }

/* Red rulers show the side gap being compared. */
.ruler { position: absolute; top: 64px; height: 18px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.ruler::before { content: ""; position: absolute; inset: 8px 0 auto; height: 1px; background: var(--ruler); }
.ruler span { position: relative; top: 14px; font-family: var(--mono); font-size: 10px; color: var(--ruler); background: var(--card); padding: 0 3px; white-space: nowrap; }
.ruler.l { left: 0; width: max(var(--gap), 1px); }
.ruler.r { right: 0; width: max(var(--gap), 1px); }

/* ---------- Picker (verbatim from emilkowalski/skills PICKER.md) ---------- */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>Board tab: side gap options</h1>
      <p>Flip with the picker or keys 1–5. Red rulers show the space between the card edge and the lists.</p>
    </div>
    <button class="theme" id="themeBtn" type="button">Dark mode</button>
  </div>
  <div class="note" id="note"></div>

  <div class="card">
    <div class="head"><b>Order Board</b><i></i><span>3 orders</span></div>
    <div class="tabs"><div class="tray">
      <div class="t"><b>49</b><span style="--d:#555">All Orders</span></div>
      <div class="t"><b>1</b><span style="--d:#F5B400">Pending</span></div>
      <div class="t"><b>1</b><span style="--d:#F46B86">Incomplete orders</span></div>
      <div class="t"><b>4</b><span style="--d:#FB8C3C">On Hold</span></div>
      <div class="t"><b>27</b><span style="--d:#0EA5E9">Confirmed</span></div>
      <div class="t"><b>0</b><span style="--d:#84CC16">Print</span></div>
      <div class="t"><b>11</b><span style="--d:#8B5CF6">Ready to Transit</span></div>
      <div class="t"><b>0</b><span style="--d:#6366F1">In-Transit</span></div>
      <div class="t"><b>0</b><span style="--d:#F43F5E">Follow up</span></div>
      <div class="t"><b>0</b><span style="--d:#10B981">Delivered</span></div>
      <div class="t"><b>6</b><span style="--d:#A1A1AA">Cancelled</span></div>
      <div class="t on"><b>3</b><span style="--d:#14B8A6">Board</span></div>
    </div></div>
    <div class="stage" id="stage"></div>
  </div>
</div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Current · 24px</button>
  <button class="proto-picker-item">Snug · 12px</button>
  <button class="proto-picker-item">Tight · 6px</button>
  <button class="proto-picker-item">Flush · 0</button>
  <button class="proto-picker-item">Fit width</button>
</nav>

<script>
(function () {
  const root = document.documentElement;
  root.setAttribute('data-theme', 'light');
  const themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', () => {
    const dark = root.getAttribute('data-theme') !== 'dark';
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    themeBtn.textContent = dark ? 'Light mode' : 'Dark mode';
  });

  const LISTS = [
    { name: 'Reschedule · পরে পাঠাবে', color: '#F59E0B', cards: [{ id: 'SK-1047', who: 'ফারহানা ইসলাম', when: 'Oct 25', note: '৩ দিন পর পাঠাতে বলেছেন, শুক্রবারের পরে।', meta: 'On Hold · 1 item' }] },
    { name: 'VIP', color: '#8B5CF6', cards: [{ id: 'SK-1052', who: 'Sabbir', when: 'Today', note: 'সবসময় সন্ধ্যা ৬টার পরে ডেলিভারি।', meta: 'Confirmed · 1 item' }] },
    { name: 'Heavy Parcels', color: '#3B82F6', cards: [{ id: 'SK-1039', who: 'মাহমুদুল হাসান', when: 'Tomorrow', note: 'দুই কার্টনে ভাগ করতে হবে।', meta: 'Confirmed · 9 items', heavy: true }] },
    { name: 'বিশেষ নির্দেশনা', color: '#14B8A6', cards: [] },
  ];

  // Each variant changes only the board's side gap (and, for Fit width, how lists size).
  const VARIANTS = [
    { gap: 24, colgap: 12, colw: '290px', neww: '260px', note: '<b>Current.</b> 24px each side, matching the toolbar above. The board scrolls sideways when lists overflow.' },
    { gap: 12, colgap: 12, colw: '290px', neww: '260px', note: '<b>Snug.</b> 12px each side, the same as the space between lists.' },
    { gap: 6, colgap: 10, colw: '290px', neww: '260px', note: '<b>Tight.</b> 6px each side; the lists sit close to the card edge.' },
    { gap: 0, colgap: 12, colw: '290px', neww: '260px', note: '<b>Flush.</b> No side space; lists start and end at the card edge.' },
    { gap: 24, colgap: 12, colw: 'calc((100% - 252px) / 4)', neww: '180px', note: '<b>Fit width.</b> 24px each side, and the four lists stretch so nothing is cut off or scrolls on a wide screen.' },
  ];

  function render(v) {
    const lists = LISTS.map(l => `
      <section class="col">
        <div class="col-h"><span class="dot" style="background:${l.color}"></span><b>${l.name}</b><span class="badge">${l.cards.length}</span>${l.cards.length ? '' : '<span class="x">×</span>'}</div>
        <div class="cards">${l.cards.length ? l.cards.map(c => `
          <div class="c"><div class="r"><span>#${c.id}</span><span class="when">${c.when}</span></div>
          <span class="n">${c.who}</span><p>${c.note}</p>
          <div class="f"><span>${c.meta}</span>${c.heavy ? '<span class="heavy">Heavy</span>' : ''}</div></div>`).join('')
          : '<div class="empty">এখানে অর্ডার টেনে আনুন</div>'}</div>
        <div class="addrow">＋ Add order</div>
      </section>`).join('');
    return `<div style="--gap:${v.gap}px;--colgap:${v.colgap}px;--colw:${v.colw};--neww:${v.neww}">
      <div class="toolbar"><div class="meta"><b>3 orders on the board</b><span>4 lists</span></div>
        <div class="tools"><div class="search">⌕ Search any order: number, name or phone</div><button class="add" type="button">＋ Add order</button></div></div>
      <div class="board">${lists}<div class="newlist">＋ New list</div></div>
      <div class="ruler l"><span>${v.gap}px</span></div><div class="ruler r"><span>${v.gap}px</span></div>
    </div>`;
  }

  const variants = VARIANTS.map(v => () => render(v));

  // ---------- Picker wiring (verbatim from PICKER.md) ----------
  const stage = document.getElementById('stage');
  const picker = document.querySelector('.proto-picker');
  const highlight = picker.querySelector('.proto-picker-highlight');
  const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
  let current = 0;
  function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
  function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); document.getElementById('note').innerHTML = VARIANTS[i].note; }); }
  function setActive(i) {
    if (i < 0 || i >= variants.length) return;
    current = i;
    items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
    moveHighlight();
    try { const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url); } catch (e) {}
    mount(i);
  }
  items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
  window.addEventListener('resize', moveHighlight);
  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const num = parseInt(e.key, 10);
    if (num >= 1 && num <= variants.length) setActive(num - 1);
    else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
    else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  });
  let startV = 1;
  try { startV = parseInt(new URLSearchParams(location.search).get('v'), 10) || 1; } catch (e) {}
  setActive(startV - 1);
  requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
})();
</script>
