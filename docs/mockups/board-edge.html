<title>Board Edge Variants</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
/* The Orders card as the Board tab renders it. Each variant changes only how the
   sideways-scrolling board meets the card's left and right edges. */
@property --fade-l { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --fade-r { syntax: "<length>"; inherits: false; initial-value: 0px; }
:root {
  --page: #F2F2F0; --card: #FFFFFF; --frame: #EFEFEF; --panel: #FFFFFF; --tray: rgba(0,0,0,0.045); --well: #F6F6F4;
  --fg: #16181D; --muted: #6B6E76; --faint: #A3A6AD; --border: rgba(0,0,0,0.10); --dash: rgba(0,0,0,0.14);
  --primary: #1A1D24; --primary-fg: #FAFAFA;
  --font: "Geist", ui-sans-serif, system-ui, sans-serif; --bn: "Hind Siliguri", "Geist", sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0F1012; --card: #17181B; --frame: #1F2024; --panel: #17181B; --tray: rgba(255,255,255,0.06); --well: #131416;
  --fg: #EDEDEF; --muted: #A0A3AA; --faint: #6C6F76; --border: rgba(255,255,255,0.10); --dash: rgba(255,255,255,0.16);
  --primary: #EDEDEF; --primary-fg: #111214; color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #0F1012; --card: #17181B; --frame: #1F2024; --panel: #17181B; --tray: rgba(255,255,255,0.06); --well: #131416;
  --fg: #EDEDEF; --muted: #A0A3AA; --faint: #6C6F76; --border: rgba(255,255,255,0.10); --dash: rgba(255,255,255,0.16);
  --primary: #EDEDEF; --primary-fg: #111214; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--fg); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; padding-bottom: 100px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 20px; font-weight: 400; }
.top p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.theme { border: 0; border-radius: 999px; height: 30px; padding: 0 12px; background: var(--card); color: var(--fg); box-shadow: 0 0 0 1px var(--border); cursor: pointer; font: inherit; font-size: 12px; transition: transform 160ms var(--ease); }
.theme:active { transform: scale(0.97); }
.note { font-size: 13px; color: var(--muted); max-width: 820px; line-height: 1.5; min-height: 40px; }
.note b { color: var(--fg); font-weight: 500; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.head { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-bottom: 1px solid var(--border); }
.head b { font-size: 15px; font-weight: 600; }
.head i { width: 1px; height: 14px; background: var(--border); }
.head span { color: var(--muted); font-size: 13px; }
.tabs { padding: 10px 8px; border-bottom: 1px solid var(--border); background: var(--page); overflow-x: auto; }
.tray { display: flex; background: var(--tray); border-radius: 12px; padding: 4px; min-width: max-content; }
.tabs .t { flex: 1 0 92px; text-align: center; padding: 12px 14px 11px; border-radius: 9px; color: var(--muted); }
.tabs .t b { display: block; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; color: var(--fg); opacity: .55; font-variant-numeric: tabular-nums; }
.tabs .t span { display: inline-flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 11px; font-weight: 500; white-space: nowrap; }
.tabs .t span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--d, #888); }
.tabs .t.on { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.05); color: var(--fg); }
.tabs .t.on b { opacity: 1; }

/* ---------- Toolbar (shared; its side padding always equals the board gutter) ---------- */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px var(--gutter) 12px; }
.meta { display: flex; align-items: baseline; gap: 10px; }
.meta b { font-weight: 500; }
.meta span { font-size: 12px; color: var(--muted); }
.tools { display: flex; gap: 8px; flex: 0 1 560px; min-width: 0; align-items: center; }
.search { flex: 1; min-width: 0; height: 36px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; }
.btn { height: 36px; border: 0; border-radius: 8px; background: var(--primary); color: var(--primary-fg); font: inherit; font-size: 13px; font-weight: 500; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; transition: transform 150ms var(--ease); }
.btn:active, .nav button:active:not(:disabled) { transform: scale(0.97); }
svg { flex: none; }

/* ---------- Columns (as in the screenshot) ---------- */
.board { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; scrollbar-width: thin; padding-top: 4px; padding-bottom: 24px; }
.col { flex: 0 0 290px; background: var(--frame); border: 1px solid var(--border); border-radius: 12px; padding: 4px; display: grid; gap: 4px; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.col-h b { flex: 1; min-width: 0; font-family: var(--bn); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { min-width: 20px; height: 20px; padding: 0 5px; border: 1px solid var(--border); border-radius: 5px; font-size: 11px; display: grid; place-items: center; font-variant-numeric: tabular-nums; background: var(--card); }
.x { color: var(--faint); display: grid; place-items: center; width: 20px; height: 20px; }
.cards { display: grid; gap: 6px; padding: 2px; }
.c { background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 12px; display: grid; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.c .r { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.c .r .when { font-family: var(--font); font-weight: 500; color: #B45309; }
.c .n { font-family: var(--bn); font-weight: 500; font-size: 14px; }
.c p { margin: 0; font-family: var(--bn); font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c .f { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--muted); }
.empty { border: 1px dashed var(--dash); border-radius: 9px; padding: 22px 12px; text-align: center; font-family: var(--bn); font-size: 13px; color: var(--muted); }
.addrow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px; color: var(--muted); }
.newlist { flex: 0 0 240px; height: 46px; border: 1px dashed var(--dash); border-radius: 12px; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--muted); font-size: 13px; }
/* Flex scrollers drop trailing padding, so a spacer holds the right gutter open. */
.board::after { content: ""; flex: 0 0 var(--tail, 0px); align-self: stretch; }

/* ---------- 1 · Current: scroller inset 12px, cut at a flat line ---------- */
.v-current .board { margin: 0 12px; }

/* ---------- 2 · Bleed: scroller runs to the card edge; the card's own edge is the cut ---------- */
.v-bleed .board { padding-inline: var(--gutter) 0; --tail: 12px; }

/* ---------- 3 · Fade: bleed + edges dissolve only toward the side that has more ---------- */
.v-fade .board {
  padding-inline: var(--gutter) 0; --tail: 12px;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent);
          mask-image: linear-gradient(to right, transparent, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent);
  transition: --fade-l 200ms var(--ease), --fade-r 200ms var(--ease);
}
.v-fade .board[data-more-l] { --fade-l: 56px; }
.v-fade .board[data-more-r] { --fade-r: 72px; }

/* ---------- 4 · Fit: lists share the width, so 4 lists never scroll ---------- */
.v-fit .board { padding-inline: var(--gutter) 0; --tail: 12px; }
.v-fit .col { flex: 1 0 216px; max-width: 360px; }
.v-fit .newlist { flex: 0 0 46px; width: 46px; padding: 0; justify-content: center; }
.v-fit .newlist span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- 5 · Pager: bleed + snap to whole lists, arrows in the toolbar ---------- */
.v-pager .board { padding-inline: var(--gutter) 0; --tail: 12px; scroll-snap-type: x mandatory; scroll-padding-inline: var(--gutter); scrollbar-width: none; }
.v-pager .board::-webkit-scrollbar { display: none; }
.v-pager .col, .v-pager .newlist { scroll-snap-align: start; }
.nav { display: inline-flex; align-items: center; gap: 2px; height: 36px; padding: 0 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
.nav button { width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); display: grid; place-items: center; cursor: pointer; transition: transform 150ms var(--ease), opacity 150ms ease-out; }
.nav button:hover:not(:disabled) { background: var(--tray); }
.nav button:disabled { opacity: .3; cursor: default; }
.nav span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding: 0 6px; white-space: nowrap; }

/* ---------- 6 · Well: board sits in a rounded inset well, so both cuts are rounded ---------- */
.v-well .wellbox { margin: 0 var(--gutter) 20px; border-radius: 14px; background: var(--well); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden; }
.v-well .board { padding: 0; --tail: 10px; gap: 10px; }

@media (prefers-reduced-motion: reduce) { .v-fade .board { transition: none; } }

/* ---------- Picker (verbatim from emilkowalski/skills PICKER.md) ---------- */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>Board tab: right edge options</h1>
      <p>Flip with the picker, keys 1–6 or ← →. Scroll the board sideways in each one to see both edges.</p>
    </div>
    <button class="theme" id="themeBtn" type="button">Dark mode</button>
  </div>
  <div class="note" id="note"></div>

  <div class="card">
    <div class="head"><b>Order Board</b><i></i><span>3 orders</span></div>
    <div class="tabs"><div class="tray">
      <div class="t"><b>49</b><span style="--d:#555">All Orders</span></div>
      <div class="t"><b>1</b><span style="--d:#F5B400">Pending</span></div>
      <div class="t"><b>4</b><span style="--d:#FB8C3C">On Hold</span></div>
      <div class="t"><b>27</b><span style="--d:#0EA5E9">Confirmed</span></div>
      <div class="t"><b>11</b><span style="--d:#8B5CF6">Ready to Transit</span></div>
      <div class="t"><b>0</b><span style="--d:#10B981">Delivered</span></div>
      <div class="t"><b>6</b><span style="--d:#A1A1AA">Cancelled</span></div>
      <div class="t on"><b>3</b><span style="--d:#14B8A6">Board</span></div>
    </div></div>
    <div id="stage"></div>
  </div>
</div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Current</button>
  <button class="proto-picker-item">Bleed</button>
  <button class="proto-picker-item">Fade</button>
  <button class="proto-picker-item">Fit</button>
  <button class="proto-picker-item">Pager</button>
  <button class="proto-picker-item">Well</button>
</nav>

<script>
(function () {
  const root = document.documentElement;
  root.setAttribute('data-theme', 'light');
  const themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', () => {
    const dark = root.getAttribute('data-theme') !== 'dark';
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    themeBtn.textContent = dark ? 'Light mode' : 'Dark mode';
  });

  const I = {
    search: '<svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"><circle cx="112" cy="112" r="80"/><line x1="168.6" y1="168.6" x2="224" y2="224"/></svg>',
    plus: '<svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"><line x1="40" y1="128" x2="216" y2="128"/><line x1="128" y1="40" x2="128" y2="216"/></svg>',
    x: '<svg width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"><line x1="200" y1="56" x2="56" y2="200"/><line x1="200" y1="200" x2="56" y2="56"/></svg>',
    left: '<svg width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><polyline points="160 208 80 128 160 48"/></svg>',
    right: '<svg width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><polyline points="96 48 176 128 96 208"/></svg>',
  };

  const LISTS = [
    { name: 'Reschedule · পরে পাঠাবে', color: '#F59E0B', cards: [{ id: 'SK-1047', who: 'ফারহানা ইসলাম', when: 'Oct 25', note: '৩ দিন পর পাঠাতে বলেছেন, শুক্রবারের পরে।', meta: 'On Hold · 1 item' }] },
    { name: 'VIP', color: '#8B5CF6', cards: [{ id: 'SK-1052', who: 'Sabbir Ahmed', when: 'Today', note: 'সবসময় সন্ধ্যা ৬টার পরে ডেলিভারি।', meta: 'Confirmed · 2 items' }] },
    { name: 'Heavy Parcels', color: '#3B82F6', cards: [{ id: 'SK-1039', who: 'মাহমুদুল হাসান', when: 'Tomorrow', note: 'দুই কার্টনে ভাগ করতে হবে।', meta: 'Confirmed · 9 items' }] },
    { name: 'বিশেষ নির্দেশনা', color: '#14B8A6', cards: [] },
  ];

  const VARIANTS = [
    { cls: 'v-current', gutter: '12px', note: '<b>Current.</b> The scroller sits 12px inside the card, so lists are cut at a flat line 12px in from the edge. The left side looks right only because nothing has scrolled yet.' },
    { cls: 'v-bleed', gutter: '12px', note: '<b>Bleed.</b> The scroller runs to the card’s own edge. A cut-off list now disappears under the card border, which reads as “there is more” instead of a stray line. Scroll right: the last item keeps the same 12px gap as the left.' },
    { cls: 'v-fade', gutter: '12px', note: '<b>Fade.</b> Bleed, plus the edge softly fades on whichever side has more lists. The fade appears and disappears as you scroll and is gone at either end, so the first and last lists sit sharp.' },
    { cls: 'v-fit', gutter: '12px', note: '<b>Fit.</b> Lists share the available width (216–360px each) and “New list” becomes a compact + tile. With 4 lists nothing is cut off on a laptop screen; scrolling only starts with 5 or more.' },
    { cls: 'v-pager', gutter: '12px', note: '<b>Pager.</b> Bleed, plus scrolling snaps so a list always starts exactly at the left gutter. ‹ › next to Add order move one list at a time, and the counter shows which lists are in view.' },
    { cls: 'v-well', gutter: '12px', note: '<b>Well.</b> The board sits in a soft rounded inset well inside the card. The cut is now the well’s rounded corner, so the left and right edges match when scrolled.' },
  ];

  function col(l) {
    return `<section class="col">
      <div class="col-h"><span class="dot" style="background:${l.color}"></span><b>${l.name}</b><span class="badge">${l.cards.length}</span><span class="x">${I.x}</span></div>
      <div class="cards">${l.cards.length ? l.cards.map(c => `
        <div class="c"><div class="r"><span>#${c.id}</span><span class="when">${c.when}</span></div>
        <span class="n">${c.who}</span><p>${c.note}</p><div class="f"><span>${c.meta}</span></div></div>`).join('')
        : '<div class="empty">এখানে অর্ডার টেনে আনুন</div>'}</div>
      <div class="addrow">${I.plus} Add order</div>
    </section>`;
  }

  function render(v) {
    const nav = v.cls === 'v-pager'
      ? `<div class="nav"><button type="button" data-step="-1" aria-label="Previous list">${I.left}</button><span data-range>1–3 of 5</span><button type="button" data-step="1" aria-label="Next list">${I.right}</button></div>` : '';
    const board = `<div class="board">${LISTS.map(col).join('')}<div class="newlist">${I.plus}<span>New list</span></div></div>`;
    return `<div class="${v.cls}" style="--gutter:${v.gutter}">
      <div class="toolbar"><div class="meta"><b>3 orders on the board</b><span>4 lists</span></div>
        <div class="tools"><div class="search">${I.search} Search any order: number, name or phone</div>${nav}<button class="btn" type="button">${I.plus} Add order</button></div></div>
      ${v.cls === 'v-well' ? `<div class="wellbox">${board}</div>` : board}
    </div>`;
  }

  // Fade and Pager both read the scroll position.
  function wire(stageEl) {
    const board = stageEl.querySelector('.board');
    if (!board) return;
    const items = [...board.querySelectorAll('.col, .newlist')];
    const range = stageEl.querySelector('[data-range]');
    const prev = stageEl.querySelector('[data-step="-1"]');
    const next = stageEl.querySelector('[data-step="1"]');
    function update() {
      const max = board.scrollWidth - board.clientWidth;
      board.toggleAttribute('data-more-l', board.scrollLeft > 2);
      board.toggleAttribute('data-more-r', board.scrollLeft < max - 2);
      if (range) {
        const left = board.getBoundingClientRect().left, right = left + board.clientWidth;
        const seen = items.map((el, i) => { const r = el.getBoundingClientRect(); return r.left >= left - 1 && r.right <= right + 1 ? i : -1; }).filter(i => i >= 0);
        range.textContent = seen.length ? `${seen[0] + 1}–${seen[seen.length - 1] + 1} of ${items.length}` : `of ${items.length}`;
        prev.disabled = board.scrollLeft <= 2;
        next.disabled = board.scrollLeft >= max - 2;
      }
    }
    board.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    stageEl.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
      const step = items[0].getBoundingClientRect().width + 12;
      board.scrollBy({ left: step * Number(b.dataset.step), behavior: reduce ? 'auto' : 'smooth' });
    }));
    update();
  }

  const variants = VARIANTS.map(v => () => render(v));

  // ---------- Picker wiring (from PICKER.md) ----------
  const stage = document.getElementById('stage');
  const picker = document.querySelector('.proto-picker');
  const highlight = picker.querySelector('.proto-picker-highlight');
  const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
  let current = 0;
  function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
  function mount(i) {
    stage.innerHTML = '';
    requestAnimationFrame(() => { stage.innerHTML = variants[i](); document.getElementById('note').innerHTML = VARIANTS[i].note; wire(stage); });
  }
  function setActive(i) {
    if (i < 0 || i >= variants.length) return;
    current = i;

    mount(i);
  }
  items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
  window.addEventListener('resize', moveHighlight);
  document.addEventListener('keydown', (e) => {

  try { startV = parseInt(new URLSearchParams(location.search).get('v'), 10) || 1; } catch (e) {}
  setActive(startV - 1);
  requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
})();
</script>
